image: codecr.jlab.org/hallb/clas12/container-forge/base:latest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_new_commit: interruptible
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
      auto_cancel:
        on_new_commit: conservative
    - if: $CI_COMMIT_TAG
      auto_cancel:
        on_new_commit: conservative

default:
  interruptible: true
  before_script:
    - export CLARA_HOME=$CI_PROJECT_DIR/clara
    - export COATJAVA=$CI_PROJECT_DIR/coatjava
    - export PATH=$CLARA_HOME/plugins/clas12/bin:$PATH
    - export PATH=$CLARA_HOME/bin:$PATH
    - export PATH=$COATJAVA/bin:$PATH

stages:
  - mirror
  - build
  - test
  - deploy

mirror:
  stage: mirror
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git config --global user.email "ci-bot@code.jlab.org"
    - git config --global user.name "GitLab CI"
    - git checkout development
    - git config pull.rebase true
    - git remote set-url origin https://github.com/jeffersonlab/coatjava
    - git pull origin development
    - git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@code.jlab.org/hallb/clas12/coatjava/coatjava.git
    - git push

build:
  stage: build
  needs:
    - job: mirror
      optional: true
  script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - ./build-coatjava.sh --lfs --clara -T$JL_RUNNER_AVAIL_CPU --quiet --no-progress
    - tar -czf coatjava.tar.gz coatjava
    - tar -czf clara.tar.gz clara
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - coatjava.tar.gz
      - clara.tar.gz

.depana:
  allow_failure: true
  stage: build
  script:
    - libexec/dependency-tree.sh
    - libexec/dependency-analysis.sh

download:
  stage: build
  script:
# XRootD:
#    - xrdcp xroot://sci-xrootd.jlab.org///osgpool/hallb/clas12/validation/raw/rg-d/clas_018779.evio.01339 ./
# validation-data git-lfs repo:
#    - git clone https://code.jlab.org/hallb/clas12/validation-data
#    - ls -l validation-data/raw/rg-d
#    - cp validation-data/raw/rg-d/clas_018779.evio.01339 .
# validation/advanced-tests git-lfs submodule:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git lfs install
    - git submodule update --init validation/advanced-tests/data
    - cp validation/advanced-tests/data/evio/rg-d/clas_018779.evio.01339 .
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - clas_018779.evio.01339

.spotbugs:
  stage: test
  needs: [build]
  dependencies: [build]
  script:
    - tar -xzf coatjava.tar.gz
    - ./build-coatjava.sh -T$JL_RUNNER_AVAIL_CPU --spotbugs --quiet --no-progress

.unit_tests:
  stage: test
  needs: [build]
  dependencies: [build]
  script:
    - tar -xzf coatjava.tar.gz
    - ./build-coatjava.sh -T$JL_RUNNER_AVAIL_CPU --unittests --quiet --no-progress
    - ./validation/jacoco-aggregate.sh
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - publish

.docs:
  stage: test
  needs: [build,unit_tests]
  dependencies: [build,unit_tests]
  script:
    - tar -xzf coatjava.tar.gz
    - python3 -m venv venv
    - source venv/bin/activate
    - python3 -m pip install -r docs/mkdocs/requirements.txt
    - ./docs/mkdocs/generate.sh pages
    - libexec/build-javadocs.sh
    - ls -l && ls -l pages && ls -l publish
    - mv target/reports/apidocs pages/javadoc
    - cp -r publish pages/jacoco
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - pages

kpp:
  stage: test
  needs: [build]
  dependencies: [build]
  script:
    - tar -xzf coatjava.tar.gz
    - tar -xzf clara.tar.gz
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git lfs install
    - git submodule update --init validation/advanced-tests/data
    - cd validation/advanced-tests
    - ./run-advanced-tests.sh

eb:
  stage: test
  needs: [build]
  dependencies: [build]
  script:
    - tar -xzf coatjava.tar.gz
    - tar -xzf clara.tar.gz
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git lfs install
    - git submodule update --init validation/advanced-tests/data
    - cd validation/advanced-tests
    - ./run-eb-tests.sh -100 ${ARG}
  parallel:
    matrix:
      - ARG: electronproton 
      - ARG: electronprotonC 
      - ARG: electrongamma 
      - ARG: electronneutronC
      - ARG: electronFTpion

decoder:
  stage: test
  needs: [build,download]
  dependencies: [build,download]
  script:
    - tar -xzf clara.tar.gz
    - ls -l
    - decoder4u -n 1000 -o clas_018779_01339.hipo clas_018779.evio.01339
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - clas_018779_01339.hipo

clara:
  stage: test
  needs: [build,download]
  dependencies: [build,download]
  script:
    - tar -xzf clara.tar.gz
    - run-clara -v -c $CLARA_HOME -t $JL_RUNNER_AVAIL_CPU -y ./etc/services/rgd-clarode.yml -n 100 -o out clas_018779.evio.01339

profile:
  stage: test
  needs: [build,decoder]
  dependencies: [build,decoder]
  script:
    - tar -xzf coatjava.tar.gz
    - libexec/profile -f flamegraph -e cpu       clas_018779_01339.hipo
    - libexec/profile -f flamegraph -e nativemem clas_018779_01339.hipo
    - libexec/profile -f flamegraph -e alloc     clas_018779_01339.hipo
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pro_flamegraph_cpu_clas_018779_01339
      - pro_flamegraph_nativemem_clas_018779_01339
      - pro_flamegraph_alloc_clas_018779_01339

.deploy:
  stage: deploy
  script:
    - echo DEPLOY!

.release:
  stage: deploy
  script:
    - echo RELEASE!

