mime-types:
  - binary/data-hipo
configuration:
  global:
    dcrbJitter: "true"
    variation: rgd_fall2023
  io-services:
    writer:
      schema_dir: dst
      histers:
        - org.jlab.analysis.clara.Hister$Example
  services:
    MAGFIELDS:
      magfieldSolenoidMap: Symm_solenoid_r601_phi1_z1201_13June2018.dat
      magfieldTorusMap: Full_torus_r251_phi181_z251_25Jan2021.dat
    DCCR:
      rawBankGroup: "NOISE1"
    MLTD:
      run: "18305"
    DCHAI:
      outputBankPrefix: "HB"
io-services:
  reader:
    class: org.jlab.io.clara.Clas12Reader
    name: Clas12Reader
  writer:
    class: org.jlab.io.clara.Clas12Writer
    name: Clas12Writer
services:
