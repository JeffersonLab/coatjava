# Just an example of configuring SwapEngine.
# Note, it must come before all other services.
io-services:
  reader:
    class: org.jlab.io.clara.Clas12Reader
    name: Clas12Reader
  writer:
    class: org.jlab.io.clara.Clas12Writer
    name: Clas12Writer
services:
  - class: org.jlab.service.swaps.SwapEngine
    name: SWAPS
configuration:
  services:
    SWAPS:
      timestamp: 10/13/2020
      previousTimestamp: 08/10/2020
      detectors: "BMT"
mime-types:
  - binary/data-hipo
