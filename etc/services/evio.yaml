io-services:
  reader:
    class: org.jlab.io.clara.EvioToHipoReader
    name: EvioToHipoReader
  writer:
    class: org.jlab.io.clara.HipoToTagHipoWriter
    name: HipoToHipoTagWriter
services:
  - class: org.jlab.service.eb.EBTBEngine
    name: EBTB
configuration:
  services:
    EBTB:
      dropBanks: 'true'
mime-types:
  - binary/data-hipo
