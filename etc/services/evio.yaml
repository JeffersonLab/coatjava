io-services:
  reader:
    class: org.jlab.io.clara.EvioToHipoReader
    name: EvioToHipoReader
  writer:
    class: org.jlab.io.clara.HipoToHipoTagWriter
    name: HipoToHipoTagWriter
services:
  - class: org.jlab.clas.swimtools.MagFieldsEngine
    name: MAGFIELDS
  - class: org.jlab.rec.ft.cal.FTCALEngine
    name: FTCAL
  - class: org.jlab.rec.ft.hodo.FTHODOEngine
    name: FTHODO
  - class: org.jlab.rec.ft.trk.FTTRKEngine
    name: FTTRK
  - class: org.jlab.rec.ft.FTEBEngine
    name: FTEB
configuration:
  global:
    variation: rge_spring2024
    timestamp: 05/11/2025-00:00:00
    triggerMask: "0x1"
  io-services:
    writer:
      schema_dir: $CLAS12DIR/etc/bankdefs/hipo4/singles/dst
  services:
    MAGFIELDS:
      magfieldSolenoidMap: Symm_solenoid_r601_phi1_z1201_13June2018.dat
      magfieldTorusMap: Full_torus_r251_phi181_z251_25Jan2021.dat
mime-types:
  - binary/data-hipo
