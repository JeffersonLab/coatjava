io-services:
  reader:
    class: org.jlab.io.clara.Clas12Reader
    name: Clas12Reader
  writer:
    class: org.jlab.io.clara.Clas12Writer
    name: Clas12Writer
services:
  - class: org.jlab.clas.reco.DecoderEngine
    name: DECO
  - class: org.jlab.service.eb.EBTBEngine
    name: EBTB
configuration:
  io-services:
    writer:
      schema_dir: dst
  services:
    EBTB:
      dropBanks: 'true'

mime-types:
  - binary/data-hipo
