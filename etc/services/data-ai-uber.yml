io-services:
  reader:
    class: org.jlab.io.clara.DecoderReader
    name: DecoderReader
  writer:
    class: org.jlab.io.clara.DecoderWriter
    name: DecoderWriter
services:
  - class: org.jlab.service.uber.Engines.First
    name: 1ST
  - class: org.jlab.service.uber.Engines.HitBased
    name: HB
  - class: org.jlab.service.uber.Engines.TimeBased
    name: TB
  - class: org.jlab.service.uber.Engines.Last
    name: NTH
configuration:
  global:
    variation: rgb_spring2019
  io-services:
    writer:
      schema_dir: dst
  services:
    1ST:
      magfieldSolenoidMap: Symm_solenoid_r601_phi1_z1201_13June2018.dat
      magfieldTorusMap: Full_torus_r251_phi181_z251_25Jan2021.dat
    HB:
      run: "6302"
      outputBankPrefix: "HB"
mime-types:
  - binary/data-hipo
